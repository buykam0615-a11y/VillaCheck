<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VillaCheck — Хяналт</title>
<style>
/* ── VARIABLES ── */
:root {
  --orange:      #F5A623;
  --orange-d:    #C47D0E;
  --orange-l:    #FFF8ED;
  --text:        #1a1a1a;
  --text-m:      #6b7280;
  --border:      #e5e7eb;
  --surface:     #f9fafb;
  --white:       #ffffff;
  --radius:      10px;
  --danger:      #ef4444;
  --danger-l:    #fef2f2;
  --success:     #22c55e;
  --success-l:   #f0fdf4;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Segoe UI', Arial, sans-serif; background: #f0f2f5; color: var(--text); min-height: 100vh; }

/* ── LOGIN PAGE ── */
#loginPage {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  background: linear-gradient(135deg, #fff8ed 0%, #fef3c7 50%, #fff8ed 100%);
}
.login-card {
  background: var(--white);
  border-radius: 16px;
  box-shadow: 0 8px 32px rgba(0,0,0,0.12);
  padding: 40px 36px;
  width: 100%;
  max-width: 360px;
}
.login-logo {
  text-align: center;
  margin-bottom: 28px;
}
.login-logo .icon { font-size: 48px; line-height: 1; }
.login-logo h1 { font-size: 22px; font-weight: 700; color: var(--orange-d); margin-top: 8px; }
.login-logo p  { font-size: 13px; color: var(--text-m); margin-top: 4px; }

.field { margin-bottom: 16px; }
.field label { display: block; font-size: 12px; font-weight: 600; color: var(--text-m); margin-bottom: 6px; letter-spacing: 0.4px; }
.field input {
  width: 100%;
  padding: 10px 14px;
  border: 1.5px solid var(--border);
  border-radius: 8px;
  font-size: 14px;
  color: var(--text);
  outline: none;
  transition: border-color 0.15s;
}
.field input:focus { border-color: var(--orange); box-shadow: 0 0 0 3px rgba(245,166,35,0.15); }

.btn-login {
  width: 100%;
  padding: 11px;
  background: var(--orange);
  color: white;
  border: none;
  border-radius: 8px;
  font-size: 15px;
  font-weight: 600;
  cursor: pointer;
  margin-top: 4px;
  transition: background 0.15s;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
}
.btn-login:hover { background: var(--orange-d); }
.btn-login:disabled { opacity: 0.6; cursor: not-allowed; }

.login-error {
  margin-top: 12px;
  padding: 10px 14px;
  background: var(--danger-l);
  border: 1px solid #fca5a5;
  border-radius: 8px;
  color: var(--danger);
  font-size: 13px;
  display: none;
}

/* ── MAIN APP ── */
#appPage { display: none; min-height: 100vh; }

header {
  background: var(--white);
  border-bottom: 3px solid var(--orange);
  padding: 0 20px;
  height: 56px;
  display: flex;
  align-items: center;
  gap: 14px;
  position: sticky;
  top: 0;
  z-index: 100;
  box-shadow: 0 2px 8px rgba(0,0,0,0.06);
}
.logo { font-size: 18px; font-weight: 700; color: var(--orange-d); }
.logo span { font-weight: 400; color: var(--text-m); font-size: 12px; margin-left: 4px; }
.spacer { flex: 1; }
.user-badge {
  font-size: 12px;
  color: var(--text-m);
  display: flex;
  align-items: center;
  gap: 6px;
}
.user-badge strong { color: var(--text); }

.btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 6px 14px;
  border-radius: 8px;
  border: 1.5px solid var(--border);
  background: var(--white);
  font-size: 13px;
  font-weight: 500;
  cursor: pointer;
  color: var(--text);
  transition: all 0.15s;
  white-space: nowrap;
}
.btn:hover { background: var(--surface); }
.btn-danger { border-color: #fca5a5; color: var(--danger); }
.btn-danger:hover { background: var(--danger-l); }
.btn-print {
  background: #1a1a1a;
  border-color: #1a1a1a;
  color: white;
}
.btn-print:hover { background: #333; }
.btn:disabled { opacity: 0.4; cursor: not-allowed; }

.main { max-width: 900px; margin: 0 auto; padding: 20px 16px; }

.card {
  background: var(--white);
  border-radius: var(--radius);
  border: 1px solid var(--border);
  box-shadow: 0 1px 6px rgba(0,0,0,0.06);
  padding: 18px 22px;
  margin-bottom: 18px;
}

/* APPS SCRIPT URL SETUP */
.setup-card {
  border: 2px dashed var(--orange);
  background: var(--orange-l);
}
.setup-card .card-title { color: var(--orange-d); }

.card-title {
  font-size: 11px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.7px;
  color: var(--text-m);
  margin-bottom: 12px;
}
.inline-field {
  display: flex;
  gap: 10px;
  align-items: center;
  flex-wrap: wrap;
}
.inline-field input {
  flex: 1;
  min-width: 260px;
  padding: 8px 12px;
  border: 1.5px solid var(--border);
  border-radius: 8px;
  font-size: 13px;
  font-family: monospace;
  outline: none;
}
.inline-field input:focus { border-color: var(--orange); }

/* VILLA SELECTOR */
.villa-row {
  display: flex;
  align-items: center;
  gap: 12px;
  flex-wrap: wrap;
}
.villa-row label { font-weight: 600; font-size: 14px; white-space: nowrap; }
.villa-select {
  flex: 1;
  min-width: 180px;
  padding: 9px 14px;
  border: 2px solid var(--orange);
  border-radius: var(--radius);
  font-size: 15px;
  font-weight: 600;
  color: var(--text);
  background: var(--white);
  outline: none;
  cursor: pointer;
}
.villa-select:focus { box-shadow: 0 0 0 3px rgba(245,166,35,0.2); }

/* STATUS */
.status-pill {
  display: none;
  font-size: 12px;
  padding: 4px 12px;
  border-radius: 20px;
  font-weight: 500;
}
.status-pill.loading { display: inline-block; background: var(--orange-l); color: var(--orange-d); }
.status-pill.error   { display: inline-block; background: var(--danger-l); color: var(--danger); }
.status-pill.ok      { display: inline-block; background: var(--success-l); color: #15803d; }

/* TABLE */
.cp-table { width: 100%; border-collapse: collapse; font-size: 13px; }
.cp-table thead tr { background: var(--orange); color: white; }
.cp-table thead th {
  padding: 10px 12px;
  text-align: left;
  font-size: 12px;
  font-weight: 600;
  letter-spacing: 0.3px;
}
.cp-table tbody tr:nth-child(even) { background: var(--surface); }
.cp-table tbody tr:hover { background: var(--orange-l); }
.cp-table tbody td {
  padding: 9px 12px;
  border-bottom: 1px solid var(--border);
  vertical-align: top;
}
.col-num  { width: 44px; text-align: center; color: var(--text-m); font-weight: 600; }
.col-name { width: 190px; font-weight: 500; }
.col-chk  { min-width: 200px; color: var(--text-m); font-size: 12px; }
.col-cnt  { width: 90px; text-align: center; }
.col-note { min-width: 120px; }

.count-box {
  display: inline-block; width: 50px; height: 22px;
  border: 1.5px solid #ccc; border-radius: 4px;
}
.note-line {
  display: block; width: 100%; height: 22px;
  border-bottom: 1.5px solid #ccc;
}

.empty-state {
  text-align: center; padding: 50px 20px; color: var(--text-m);
}
.empty-state .icon { font-size: 36px; margin-bottom: 10px; }
.empty-state p { font-size: 14px; }

/* SPINNER */
.spinner {
  width: 15px; height: 15px;
  border: 2px solid rgba(245,166,35,0.3);
  border-top-color: var(--orange);
  border-radius: 50%;
  animation: spin 0.7s linear infinite;
  display: inline-block;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* ── PRINT ── */
@media print {
  #loginPage { display: none !important; }
  header, .card:not(.preview-card), .screen-hide { display: none !important; }
  body { background: white; }
  .main { max-width: 100%; padding: 0; margin: 0; }
  .preview-card { border: none !important; box-shadow: none !important; padding: 0 !important; }
  .print-header { display: flex !important; }

  .cp-table { font-size: 10pt; }
  .cp-table thead tr {
    background: #F5A623 !important;
    -webkit-print-color-adjust: exact;
    print-color-adjust: exact;
  }
  .cp-table tbody td { padding: 7px 10px; }
}

.print-header {
  display: none;
  justify-content: space-between;
  align-items: flex-start;
  margin-bottom: 16px;
  border-bottom: 3px solid var(--orange);
  padding-bottom: 10px;
}
.ph-logo  { font-size: 18pt; font-weight: 700; color: #C47D0E; }
.ph-sub   { font-size: 10pt; color: #555; margin-top: 2px; }
.ph-right { text-align: right; font-size: 10pt; color: #555; }
.ph-villa { font-size: 14pt; font-weight: 700; }
</style>
</head>
<body>

<!-- ══ LOGIN PAGE ══ -->
<div id="loginPage">
  <div class="login-card">
    <div class="login-logo">
      <div class="icon">🏡</div>
      <h1>VillaCheck</h1>
      <p>Хяналтын систем</p>
    </div>

    <div class="field" id="gasUrlField">
      <label>⚙️ APPS SCRIPT URL</label>
      <input type="text" id="gasUrlInput"
             placeholder="https://script.google.com/macros/s/.../exec"
             style="font-size:11px; font-family:monospace;" />
      <div style="font-size:11px;color:#aaa;margin-top:4px">Нэг удаа оруулвал хадгалагдана</div>
    </div>
    <div style="border-top:1px solid #f0f0f0; margin: 4px 0 16px;"></div>
    <div class="field">
      <label>ХЭРЭГЛЭГЧИЙН НЭР</label>
      <input type="text" id="loginUser" placeholder="username" autocomplete="username" />
    </div>
    <div class="field">
      <label>НҮҮЦ ҮГ</label>
      <input type="password" id="loginPass" placeholder="••••••••" autocomplete="current-password" />
    </div>
    <button class="btn-login" id="loginBtn" onclick="doLogin()">
      <span id="loginBtnText">Нэвтрэх</span>
    </button>
    <div class="login-error" id="loginError"></div>
  </div>
</div>

<!-- ══ MAIN APP ══ -->
<div id="appPage">

  <header>
    <div class="logo">🏡 VillaCheck <span>Хяналт</span></div>
    <div class="spacer"></div>
    <div class="user-badge">
      👤 <strong id="headerUser"></strong>
    </div>
    <button class="btn btn-danger" onclick="doLogout()">Гарах</button>
  </header>

  <div class="main">

    <!-- Apps Script URL тохиргоо -->
    <div class="card setup-card" id="setupCard">
      <div class="card-title">⚙️ Apps Script URL тохиргоо</div>
      <div class="inline-field">
        <input type="text" id="gasUrl"
               placeholder="https://script.google.com/macros/s/AKfycb.../exec" />
        <button class="btn" onclick="saveGasUrl()" style="background:var(--orange);color:white;border-color:var(--orange)">
          Хадгалах
        </button>
      </div>
      <div style="margin-top:8px; font-size:12px; color:var(--text-m)">
        Apps Script → Deploy → Web App → URL-г энд оруулна
      </div>
    </div>

    <!-- Villa сонгох -->
    <div class="card" id="villaCard" style="display:none">
      <div class="villa-row">
        <label>🏡 Villa:</label>
        <select class="villa-select" id="villaSelect" onchange="loadCheckpoints()">
          <option value="">— Villa сонгоно уу —</option>
        </select>
        <span class="status-pill" id="mainStatus"></span>
        <button class="btn btn-print" id="printBtn" onclick="window.print()" disabled>
          🖨️ Хэвлэх
        </button>
      </div>
    </div>

    <!-- Preview -->
    <div class="card preview-card" id="previewCard" style="display:none">
      <!-- Print header -->
      <div class="print-header" id="printHeader">
        <div>
          <div class="ph-logo">🏡 VillaCheck</div>
          <div class="ph-sub">Хяналтын тайлан</div>
        </div>
        <div class="ph-right">
          <div class="ph-villa" id="phVilla"></div>
          <div id="phDate"></div>
          <div style="margin-top:4px">Нийт: <strong id="phTotal"></strong> шалгах зүйл</div>
        </div>
      </div>

      <!-- Screen preview title -->
      <div class="screen-hide" id="previewMeta"
           style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px">
        <div>
          <div style="font-size:16px;font-weight:700" id="previewTitle"></div>
          <div style="font-size:12px;color:var(--text-m)" id="previewSub"></div>
        </div>
      </div>

      <div id="tableContainer">
        <div class="empty-state">
          <div class="icon">🏠</div>
          <p>Villa сонгоно уу</p>
        </div>
      </div>
    </div>

  </div><!-- /main -->
</div><!-- /appPage -->

<script>
// ══ STATE ══
let GAS_URL = '';
let TOKEN   = '';
let USERNAME = '';

// ══ INIT ══
window.addEventListener('DOMContentLoaded', () => {
  GAS_URL  = localStorage.getItem('vc_gas_url')  || '';
  TOKEN    = localStorage.getItem('vc_token')     || '';
  USERNAME = localStorage.getItem('vc_username')  || '';

  if (GAS_URL) {
    document.getElementById('gasUrl').value = GAS_URL;
    document.getElementById('gasUrlInput').value = GAS_URL;
    // URL байгаа бол GAS URL талбарыг нуух
    document.getElementById('gasUrlField').style.display = 'none';
  }

  if (TOKEN && USERNAME) {
    showApp();
  }

  // Enter key on login
  ['loginUser','loginPass','gasUrlInput'].forEach(id => {
    document.getElementById(id).addEventListener('keydown', e => {
      if (e.key === 'Enter') doLogin();
    });
  });
});

// ══ GAS URL ══
function saveGasUrl() {
  const url = document.getElementById('gasUrl').value.trim();
  if (!url.startsWith('https://script.google.com')) {
    alert('Apps Script URL буруу байна'); return;
  }
  GAS_URL = url;
  localStorage.setItem('vc_gas_url', url);
  document.getElementById('setupCard').style.display = 'none';
  loadBuildings();
}

// ══ LOGIN ══
async function doLogin() {
  const username = document.getElementById('loginUser').value.trim();
  const password = document.getElementById('loginPass').value.trim();
  const errEl    = document.getElementById('loginError');
  const btn      = document.getElementById('loginBtn');
  const btnTxt   = document.getElementById('loginBtnText');

  errEl.style.display = 'none';

  // Login хуудасны URL талбараас авах
  const gasInput = document.getElementById('gasUrlInput').value.trim();
  if (gasInput && gasInput.startsWith('https://script.google.com')) {
    GAS_URL = gasInput;
    localStorage.setItem('vc_gas_url', GAS_URL);
    document.getElementById('gasUrl').value = GAS_URL;
  }

  if (!username || !password) { showLoginError('Нэр болон нүүц үгийг оруулна уу'); return; }
  if (!GAS_URL) { showLoginError('Apps Script URL оруулна уу (дээрх талбарт)'); return; }

  btn.disabled = true;
  btnTxt.innerHTML = '<span class="spinner"></span> Нэвтэрч байна…';

  try {
    const res = await gasPost({ action: 'login', username, password });
    if (res.ok) {
      TOKEN    = res.token;
      USERNAME = res.username;
      localStorage.setItem('vc_token',    TOKEN);
      localStorage.setItem('vc_username', USERNAME);
      showApp();
    } else {
      showLoginError(res.error || 'Нэвтрэх амжилтгүй');
    }
  } catch(e) {
    showLoginError('Серверт холбогдсонгүй: ' + e.message);
  } finally {
    btn.disabled = false;
    btnTxt.textContent = 'Нэвтрэх';
  }
}

function showLoginError(msg) {
  const el = document.getElementById('loginError');
  el.textContent = msg;
  el.style.display = 'block';
}

function showApp() {
  document.getElementById('loginPage').style.display = 'none';
  document.getElementById('appPage').style.display   = '';
  document.getElementById('headerUser').textContent  = USERNAME;

  if (!GAS_URL) {
    document.getElementById('setupCard').style.display = '';
  } else {
    document.getElementById('setupCard').style.display = 'none';
    loadBuildings();
  }
}

// ══ LOGOUT ══
function doLogout() {
  TOKEN    = '';
  USERNAME = '';
  localStorage.removeItem('vc_token');
  localStorage.removeItem('vc_username');
  document.getElementById('loginPage').style.display = '';
  document.getElementById('appPage').style.display   = 'none';
  document.getElementById('loginUser').value = '';
  document.getElementById('loginPass').value = '';
  document.getElementById('loginError').style.display = 'none';
}

// ══ LOAD BUILDINGS ══
async function loadBuildings() {
  setStatus('Уншиж байна…', 'loading');
  document.getElementById('villaCard').style.display    = '';
  document.getElementById('previewCard').style.display  = '';

  try {
    const res = await gasPost({ action: 'getBuildings', token: TOKEN });
    if (!res.ok) {
      if (res.error === 'Нэвтэрнэ үү') { doLogout(); return; }
      setStatus(res.error, 'error'); return;
    }
    const sel = document.getElementById('villaSelect');
    sel.innerHTML = '<option value="">— Villa сонгоно уу —</option>';
    (res.data || []).forEach(name => {
      const opt = document.createElement('option');
      opt.value = opt.textContent = name;
      sel.appendChild(opt);
    });
    setStatus(res.data.length + ' villa', 'ok');
    setTimeout(() => setStatus('', ''), 2000);
  } catch(e) {
    setStatus('Алдаа: ' + e.message, 'error');
  }
}

// ══ LOAD CHECKPOINTS ══
async function loadCheckpoints() {
  const villa = document.getElementById('villaSelect').value;
  if (!villa) return;

  const container = document.getElementById('tableContainer');
  container.innerHTML = '<div style="text-align:center;padding:40px"><span class="spinner"></span> <span style="margin-left:8px;color:#888;font-size:13px">Уншиж байна…</span></div>';
  setStatus('Уншиж байна…', 'loading');
  document.getElementById('printBtn').disabled = true;

  try {
    const res = await gasPost({ action: 'getCheckpoints', token: TOKEN, villa });
    if (!res.ok) {
      container.innerHTML = `<div class="empty-state"><div class="icon">⚠️</div><p>${res.error}</p></div>`;
      setStatus(res.error, 'error'); return;
    }
    renderTable(res.data || [], villa);
    setStatus(res.data.length + ' шалгах зүйл', 'ok');
    document.getElementById('printBtn').disabled = false;

    // Print meta
    const now = new Date();
    const ds  = now.getFullYear() + '/' + pad(now.getMonth()+1) + '/' + pad(now.getDate());
    document.getElementById('previewTitle').textContent = '🏡 ' + villa;
    document.getElementById('previewSub').textContent   = res.data.length + ' шалгах зүйл · ' + ds;
    document.getElementById('phVilla').textContent = villa;
    document.getElementById('phDate').textContent  = ds;
    document.getElementById('phTotal').textContent = res.data.length;

  } catch(e) {
    container.innerHTML = `<div class="empty-state"><div class="icon">❌</div><p>Алдаа: ${e.message}</p></div>`;
    setStatus('Алдаа', 'error');
  }
}

// ══ RENDER TABLE ══
function renderTable(rows, villa) {
  if (!rows.length) {
    document.getElementById('tableContainer').innerHTML =
      `<div class="empty-state"><div class="icon">🔍</div><p>"${esc(villa)}" вилла-д шалгах зүйл олдсонгүй</p></div>`;
    return;
  }
  let html = `
    <table class="cp-table">
      <thead><tr>
        <th class="col-num">№</th>
        <th class="col-name">Үндсэн шалгах</th>
        <th class="col-chk">Check / Тайлбар</th>
        <th class="col-cnt">Тооллого</th>
        <th class="col-note">Тэмдэглэл</th>
      </tr></thead>
      <tbody>`;

  rows.forEach((r, i) => {
    const chkHtml = (r.check || '')
      .split(/\n|(?=\d+\.)/)
      .filter(s => s.trim())
      .map(s => `<div style="margin-bottom:2px">${esc(s.trim())}</div>`)
      .join('');
    html += `<tr>
      <td class="col-num">${esc(r.num || String(i+1))}</td>
      <td class="col-name">${esc(r.name)}</td>
      <td class="col-chk">${chkHtml || '—'}</td>
      <td class="col-cnt"><span class="count-box">${esc(r.count)}</span></td>
      <td class="col-note"><span class="note-line"></span></td>
    </tr>`;
  });

  html += '</tbody></table>';
  document.getElementById('tableContainer').innerHTML = html;
}

// ══ GAS POST ══
async function gasPost(body) {
  const res = await fetch(GAS_URL, {
    method:   'POST',
    // Content-Type: application/json хасав — Apps Script CORS preflight дэмждэггүй
    // text/plain ашиглавал preflight илгээхгүй, шууд POST хийнэ
    headers:  { 'Content-Type': 'text/plain;charset=utf-8' },
    body:     JSON.stringify(body),
    redirect: 'follow'   // Apps Script redirect буцаадаг тул дагах ёстой
  });
  if (!res.ok) throw new Error('HTTP ' + res.status);
  return res.json();
}

// ══ HELPERS ══
function setStatus(msg, type) {
  const el = document.getElementById('mainStatus');
  el.textContent = msg;
  el.className   = 'status-pill ' + (type || '');
}
function esc(s) {
  return (s||'').toString().replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function pad(n) { return String(n).padStart(2, '0'); }
</script>
</body>
</html>
