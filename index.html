<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VillaCheck</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg:      #0d1117;
  --bg2:     #161b22;
  --bg3:     #21262d;
  --glass:   rgba(255,255,255,0.04);
  --border:  rgba(255,255,255,0.08);
  --border2: rgba(255,255,255,0.14);
  --gold:    #F5A623;
  --gold-d:  #C47D0E;
  --gold-g:  linear-gradient(135deg,#F5A623,#ff6b35);
  --text:    #e6edf3;
  --text-m:  #8b949e;
  --text-s:  #6e7681;
  --success: #3fb950;
  --danger:  #f85149;
  --r:       12px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}

/* ── LOGIN ── */
#loginWrap{
  min-height:100vh;display:flex;align-items:center;justify-content:center;
  background:radial-gradient(ellipse at 30% 20%,rgba(245,166,35,.12) 0%,transparent 60%),
             radial-gradient(ellipse at 70% 80%,rgba(255,107,53,.08) 0%,transparent 60%),
             var(--bg);
}
.login-box{
  background:rgba(22,27,34,0.9);border:1px solid var(--border2);
  border-radius:20px;padding:44px 40px;width:100%;max-width:400px;
  backdrop-filter:blur(20px);box-shadow:0 24px 64px rgba(0,0,0,.5);
}
.login-logo{text-align:center;margin-bottom:32px}
.login-logo .icon{font-size:52px;filter:drop-shadow(0 4px 16px rgba(245,166,35,.4))}
.login-logo h1{font-size:24px;font-weight:700;color:var(--gold);margin-top:10px;letter-spacing:-.3px}
.login-logo p{font-size:13px;color:var(--text-m);margin-top:4px}

.f{margin-bottom:16px}
.f label{display:block;font-size:11px;font-weight:600;color:var(--text-m);margin-bottom:6px;letter-spacing:.6px;text-transform:uppercase}
.f input{
  width:100%;padding:11px 14px;background:var(--bg3);border:1px solid var(--border);
  border-radius:8px;font-size:14px;color:var(--text);outline:none;font-family:inherit;
  transition:border-color .15s,box-shadow .15s;
}
.f input:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(245,166,35,.15)}
.f input::placeholder{color:var(--text-s)}
.hint{font-size:11px;color:var(--text-s);margin-top:5px}
.sep{border-top:1px solid var(--border);margin:16px 0}

.btn-login{
  width:100%;padding:12px;background:var(--gold-g);color:#000;border:none;border-radius:8px;
  font-size:15px;font-weight:700;cursor:pointer;font-family:inherit;
  transition:opacity .15s,transform .1s;letter-spacing:-.1px;
}
.btn-login:hover{opacity:.9;transform:translateY(-1px)}
.btn-login:active{transform:translateY(0)}
.btn-login:disabled{opacity:.5;cursor:not-allowed;transform:none}
.lerr{
  margin-top:14px;padding:10px 14px;background:rgba(248,81,73,.1);
  border:1px solid rgba(248,81,73,.3);border-radius:8px;color:var(--danger);
  font-size:13px;display:none;
}
.sp{width:14px;height:14px;border:2px solid rgba(0,0,0,.3);border-top-color:#000;border-radius:50%;animation:spin .7s linear infinite;display:inline-block;vertical-align:middle;margin-right:6px}
@keyframes spin{to{transform:rotate(360deg)}}

/* ── APP ── */
#app{display:none;min-height:100vh}

header{
  background:rgba(13,17,23,.95);border-bottom:1px solid var(--border);
  padding:0 24px;height:60px;display:flex;align-items:center;gap:16px;
  position:sticky;top:0;z-index:100;backdrop-filter:blur(16px);
}
.hlogo{
  font-size:16px;font-weight:700;
  background:var(--gold-g);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
  display:flex;align-items:center;gap:8px;
}
.hsp{flex:1}
.huser{font-size:13px;color:var(--text-m);display:flex;align-items:center;gap:6px}
.huser strong{color:var(--text)}
.hbtn{
  padding:6px 16px;border-radius:8px;border:1px solid rgba(248,81,73,.3);
  background:rgba(248,81,73,.08);font-size:13px;font-weight:500;cursor:pointer;
  color:var(--danger);font-family:inherit;transition:all .15s;
}
.hbtn:hover{background:rgba(248,81,73,.15)}

.main{max-width:1100px;margin:0 auto;padding:24px 20px}

/* Villa selector card */
.sel-card{
  background:var(--glass);border:1px solid var(--border);border-radius:var(--r);
  padding:20px 24px;margin-bottom:24px;display:flex;align-items:center;gap:16px;flex-wrap:wrap;
}
.sel-card label{font-size:14px;font-weight:600;color:var(--text-m);white-space:nowrap}
.vsel{
  flex:1;min-width:200px;padding:10px 16px;background:var(--bg3);border:1px solid var(--border2);
  border-radius:8px;font-size:15px;font-weight:600;color:var(--text);outline:none;
  cursor:pointer;font-family:inherit;transition:border-color .15s;
}
.vsel:focus{border-color:var(--gold)}
.vsel option{background:var(--bg2)}

.pill{display:none;font-size:12px;padding:4px 12px;border-radius:20px;font-weight:500}
.pill.ok{display:inline-block;background:rgba(63,185,80,.12);color:var(--success);border:1px solid rgba(63,185,80,.2)}
.pill.er{display:inline-block;background:rgba(248,81,73,.12);color:var(--danger);border:1px solid rgba(248,81,73,.2)}
.pill.ld{display:inline-block;background:rgba(245,166,35,.12);color:var(--gold);border:1px solid rgba(245,166,35,.2)}

.pbtn{
  padding:9px 18px;border-radius:8px;border:1px solid var(--border2);
  background:var(--bg3);font-size:13px;font-weight:500;cursor:pointer;color:var(--text);
  font-family:inherit;display:flex;align-items:center;gap:6px;white-space:nowrap;transition:all .15s;
}
.pbtn:hover{background:var(--glass);border-color:var(--gold)}
.pbtn:disabled{opacity:.4;cursor:not-allowed}

/* Content card */
.content-card{
  background:var(--glass);border:1px solid var(--border);border-radius:var(--r);
  padding:24px;
}
.ctop{margin-bottom:24px;padding-bottom:16px;border-bottom:1px solid var(--border)}
.ctitle{font-size:20px;font-weight:700;letter-spacing:-.3px}
.csub{font-size:13px;color:var(--text-m);margin-top:4px}

/* Room tabs */
.room-tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:24px}
.rtab{
  padding:7px 16px;border-radius:20px;border:1px solid var(--border);
  background:var(--bg3);font-size:13px;font-weight:500;cursor:pointer;color:var(--text-m);
  font-family:inherit;transition:all .15s;white-space:nowrap;
}
.rtab:hover{border-color:var(--border2);color:var(--text)}
.rtab.active{background:var(--gold-g);border-color:transparent;color:#000;font-weight:700}
.rtab .rc{
  display:inline-block;background:rgba(0,0,0,.2);color:inherit;
  font-size:11px;padding:1px 6px;border-radius:10px;margin-left:5px;
}
.rtab.active .rc{background:rgba(0,0,0,.25)}

/* Item grid */
.item-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:14px}
.item-card{
  background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);
  overflow:hidden;transition:border-color .15s,transform .15s,box-shadow .15s;cursor:default;
}
.item-card:hover{border-color:var(--border2);transform:translateY(-2px);box-shadow:0 8px 24px rgba(0,0,0,.3)}
.item-img-wrap{width:100%;height:150px;overflow:hidden;position:relative;background:var(--bg3)}
.item-img{width:100%;height:100%;object-fit:cover;display:block;cursor:zoom-in;transition:transform .2s}
.item-img:hover{transform:scale(1.05)}
.item-ph{width:100%;height:150px;display:flex;align-items:center;justify-content:center;background:var(--bg3);font-size:36px;color:var(--text-s);cursor:pointer;transition:background .15s}
.item-ph:hover{background:var(--bg2)}
/* Зураг солих overlay */
.img-overlay{
  position:absolute;inset:0;background:rgba(0,0,0,0);display:flex;
  align-items:flex-end;justify-content:center;padding-bottom:8px;
  transition:background .2s;
}
.item-img-wrap:hover .img-overlay{background:rgba(0,0,0,.5)}
.img-overlay-btns{display:flex;gap:6px;opacity:0;transition:opacity .2s}
.item-img-wrap:hover .img-overlay-btns{opacity:1}
.img-ov-btn{
  padding:5px 10px;border-radius:6px;border:1px solid rgba(255,255,255,.3);
  background:rgba(0,0,0,.6);color:#fff;font-size:11px;font-weight:600;
  cursor:pointer;backdrop-filter:blur(4px);font-family:inherit;transition:all .15s;
}
.img-ov-btn:hover{background:rgba(245,166,35,.8);border-color:var(--gold)}
/* Upload saving overlay */
.img-saving{
  position:absolute;inset:0;background:rgba(13,17,23,.85);
  display:none;align-items:center;justify-content:center;flex-direction:column;gap:8px;
}
.img-saving.show{display:flex}
.img-saving span{font-size:12px;color:var(--gold)}
.item-loading{
  width:100%;height:150px;display:flex;align-items:center;justify-content:center;
  background:var(--bg3);
}
.img-sp{
  width:24px;height:24px;border:2px solid var(--border2);border-top-color:var(--gold);
  border-radius:50%;animation:spin .8s linear infinite;
}
.item-body{padding:12px 14px}
.item-name{font-size:13px;font-weight:600;color:var(--text);line-height:1.35;margin-bottom:6px}
.item-qty{
  font-size:11px;color:var(--text-s);margin-bottom:10px;display:flex;align-items:center;gap:4px;
}
.qty-badge{
  background:rgba(245,166,35,.15);color:var(--gold);border:1px solid rgba(245,166,35,.2);
  font-size:11px;font-weight:700;padding:1px 7px;border-radius:6px;
}
.item-note{
  width:100%;background:transparent;border:none;border-bottom:1px solid var(--border);
  font-size:12px;color:var(--text-m);padding:4px 2px;outline:none;font-family:inherit;
  transition:border-color .15s;
}
.item-note:focus{border-bottom-color:var(--gold);color:var(--text)}
.item-note::placeholder{color:var(--text-s)}

/* Empty / loading */
.emp{text-align:center;padding:60px 20px;color:var(--text-m)}
.emp .ei{font-size:44px;margin-bottom:14px;opacity:.6}
.emp p{font-size:14px}

/* Lightbox */
#lb{display:none;position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:999;align-items:center;justify-content:center;flex-direction:column;gap:14px;backdrop-filter:blur(8px)}
#lb.open{display:flex}
#lb img{max-width:90vw;max-height:82vh;border-radius:10px;box-shadow:0 24px 80px rgba(0,0,0,.7)}
#lb .lbc{position:absolute;top:18px;right:22px;color:rgba(255,255,255,.7);font-size:30px;cursor:pointer;line-height:1;transition:color .1s}
#lb .lbc:hover{color:#fff}
#lb .lbcap{color:var(--text-m);font-size:13px}

/* Room section (print only uses) */
.room-section{display:none}
.room-section.active-section{display:block}

@media print{
  body,#app{background:#fff!important;color:#000!important}
  #loginWrap,header,.sel-card,.room-tabs{display:none!important}
  .content-card{border:none!important;background:#fff!important;padding:0!important}
  .room-section{display:block!important}
  .item-grid{grid-template-columns:repeat(3,1fr);gap:8px}
  .item-card{background:#fff!important;border:1px solid #ddd!important;break-inside:avoid}
  .item-img-wrap,.item-ph,.item-loading{height:110px!important}
  .item-body{padding:8px 10px}
  .item-name{font-size:11pt;color:#000}
  .item-qty{color:#555}
  .qty-badge{background:#f5f5f5;color:#333;border-color:#ddd}
  .ctitle{color:#000;font-size:16pt}
  .csub{color:#555}
  #lb{display:none!important}
}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="loginWrap">
  <div class="login-box">
    <div class="login-logo">
      <div class="icon">🏡</div>
      <h1>VillaCheck</h1>
      <p>Хяналтын систем</p>
    </div>
    <div class="f">
      <label>Хэрэглэгчийн нэр</label>
      <input type="text" id="uname" placeholder="username" autocomplete="username"/>
    </div>
    <div class="f">
      <label>Нүүц үг</label>
      <input type="password" id="upass" placeholder="••••••••" autocomplete="current-password"/>
    </div>
    <button class="btn-login" id="lbtn" onclick="doLogin()">Нэвтрэх</button>
    <div class="lerr" id="lerr"></div>
  </div>
</div>

<!-- APP -->
<div id="app">
  <header>
    <div class="hlogo">🏡 VillaCheck</div>
    <div class="hsp"></div>
    <div class="huser">👤 <strong id="husr"></strong></div>
    <button class="hbtn" onclick="doLogout()">Гарах</button>
  </header>

  <div class="main">
    <!-- Villa сонгох -->
    <div class="sel-card">
      <label>🏡 Villa</label>
      <select class="vsel" id="vsel" onchange="loadCP()">
        <option value="">— сонгоно уу —</option>
      </select>
      <span class="pill" id="st"></span>
      <button class="pbtn" id="xlbtn" onclick="exportExcel()" disabled>📊 Excel</button>
      <button class="pbtn" id="pbtn" onclick="doPrint()" disabled>🖨 Хэвлэх</button>
    </div>

    <!-- Хяналт -->
    <div class="content-card" id="tcard" style="display:none">
      <div class="ctop">
        <div class="ctitle" id="ttitle"></div>
        <div class="csub" id="tsub"></div>
      </div>
      <!-- Room tabs -->
      <div class="room-tabs" id="roomTabs"></div>
      <!-- Grid -->
      <div id="tc">
        <div class="emp"><div class="ei">🏠</div><p>Villa сонгоно уу</p></div>
      </div>
    </div>
  </div>
</div>

<!-- Lightbox -->
<div id="lb" onclick="closeLb()">
  <span class="lbc">✕</span>
  <img id="lbimg" src="" alt="">
  <div class="lbcap" id="lbcap"></div>
</div>

<!-- Hidden file input зураг upload-д -->
<input type="file" id="imgFileInput" accept="image/*" style="display:none" onchange="onFileSelected(event)"/>

<script>
var GAS='https://script.google.com/macros/s/AKfycbzNpJUY5nLQ1RigNQvU-nWpQdz-jU3CJWIDYerH7MV5vrgtOvocFUFoT0B4WNxMH5Cg9Q/exec';
var TOKEN='', USER='';
var cache={};
var allGroups=[];
var activeRoom='';

window.onload = function() {
  TOKEN = localStorage.getItem('vc_tok') || '';
  USER  = localStorage.getItem('vc_usr') || '';
  if (TOKEN && USER) { showApp(); return; }
  document.getElementById('loginWrap').style.display = 'flex';
};

function doLogin() {
  var u=document.getElementById('uname').value.trim();
  var p=document.getElementById('upass').value.trim();
  var btn=document.getElementById('lbtn');
  document.getElementById('lerr').style.display='none';
  if (!u||!p) { showErr('Нэр болон нүүц үгийг оруулна уу'); return; }
  btn.disabled=true;
  btn.innerHTML='<span class="sp"></span>Нэвтэрч байна…';
  gasPost({action:'login',username:u,password:p})
    .then(function(r){
      if(r.ok){
        TOKEN=r.token; USER=r.username;
        localStorage.setItem('vc_tok',TOKEN);
        localStorage.setItem('vc_usr',USER);
        showApp();
      } else showErr(r.error||'Нэвтрэх амжилтгүй');
    })
    .catch(function(e){ showErr('Холбогдсонгүй: '+e.message); })
    .finally(function(){ btn.disabled=false; btn.textContent='Нэвтрэх'; });
}
function showErr(m){ var e=document.getElementById('lerr'); e.textContent=m; e.style.display='block'; }

function showApp(){
  document.getElementById('loginWrap').style.display='none';
  document.getElementById('app').style.display='block';
  document.getElementById('husr').textContent=USER;
  document.getElementById('tcard').style.display='';
  loadBuildings();
}
function doLogout(){
  TOKEN=''; USER='';
  localStorage.removeItem('vc_tok');
  localStorage.removeItem('vc_usr');
  localStorage.removeItem('vc_gas');
  location.reload();
}

function loadBuildings(){
  setSt('Уншиж байна…','ld');
  gasPost({action:'getBuildings',token:TOKEN})
    .then(function(r){
      if(!r.ok){setSt(r.error,'er');return;}
      var s=document.getElementById('vsel');
      s.innerHTML='<option value="">— сонгоно уу —</option>';
      (r.data||[]).forEach(function(n){
        var o=document.createElement('option'); o.value=o.textContent=n; s.appendChild(o);
      });
      setSt(r.data.length+' villa','ok');
      setTimeout(function(){setSt('','');},2500);
    })
    .catch(function(e){setSt('Алдаа: '+e.message,'er');});
}

function loadCP(){
  var v=document.getElementById('vsel').value;
  if(!v) return;
  var tc=document.getElementById('tc');
  document.getElementById('roomTabs').innerHTML='';
  tc.innerHTML='<div class="emp"><div class="img-sp" style="width:36px;height:36px;margin:0 auto 16px"></div><p>Уншиж байна…</p></div>';
  setSt('Уншиж байна…','ld');
  document.getElementById('pbtn').disabled=true;
  document.getElementById('xlbtn').disabled=true;
  allGroups=[];

  gasPost({action:'getCheckpoints',token:TOKEN,villa:v})
    .then(function(r){
      if(!r.ok){
        tc.innerHTML='<div class="emp"><div class="ei">⚠️</div><p>'+esc(r.error)+'</p></div>';
        setSt(r.error,'er'); return;
      }
      allGroups=r.data||[];
      var total=allGroups.reduce(function(s,g){return s+g.items.length;},0);
      setSt(total+' тавилга','ok');
      document.getElementById('pbtn').disabled=false;
      document.getElementById('xlbtn').disabled=false;
      var now=new Date();
      var ds=now.getFullYear()+'/'+pad(now.getMonth()+1)+'/'+pad(now.getDate());
      document.getElementById('ttitle').textContent='🏡 '+v;
      document.getElementById('tsub').textContent=total+' тавилга · '+ds;
      buildTabs();
      if(allGroups.length>0) showRoom(allGroups[0].room);
    })
    .catch(function(e){
      tc.innerHTML='<div class="emp"><div class="ei">❌</div><p>'+esc(e.message)+'</p></div>';
      setSt('Алдаа','er');
    });
}

function buildTabs(){
  var tabs=document.getElementById('roomTabs');
  tabs.innerHTML='';
  allGroups.forEach(function(g){
    var btn=document.createElement('button');
    btn.className='rtab';
    btn.innerHTML=esc(g.room)+' <span class="rc">'+g.items.length+'</span>';
    btn.onclick=function(){ showRoom(g.room); };
    btn.dataset.room=g.room;
    tabs.appendChild(btn);
  });
}

// Зураг upload хийх үед ямар card-д хамаарахыг хадгалах
var uploadTarget = { cid:'', assetId:'', oldPath:'' };

function showRoom(roomName){
  activeRoom=roomName;
  document.querySelectorAll('.rtab').forEach(function(b){
    b.classList.toggle('active', b.dataset.room===roomName);
  });
  var group=allGroups.find(function(g){return g.room===roomName;});
  if(!group) return;
  var tc=document.getElementById('tc');
  var html='<div class="item-grid">';
  group.items.forEach(function(item,idx){
    var cid='c_'+idx;
    var aid=esc(item.assetId||'');
    var pp=esc(item.picPath||'');
    html+='<div class="item-card">';
    if(item.picPath){
      html+='<div class="item-loading" id="il_'+cid+'"><div class="img-sp"></div></div>';
    } else {
      // Зураг байхгүй — upload товч харуулна
      html+='<div class="item-ph" onclick="triggerUpload(\''+cid+'\',\''+aid+'\',\'\')">📷<div style="font-size:11px;margin-top:6px;color:var(--text-s)">Зураг нэмэх</div></div>';
    }
    html+='<div class="item-body">';
    html+='<div class="item-name">'+esc(item.furniture)+'</div>';
    html+='<div class="item-qty">Ширхэг: <span class="qty-badge">'+esc(item.qty||'—')+'</span></div>';
    html+='<input class="item-note" type="text" placeholder="Тэмдэглэл…" value="'+esc(item.comment||'')+'"/>';
    html+='</div></div>';
  });
  html+='</div>';
  tc.innerHTML=html;
  group.items.forEach(function(item,idx){
    if(!item.picPath) return;
    var cid='c_'+idx;
    loadImg(item.picPath, cid, item.furniture, item.assetId);
  });
}

function loadImg(picPath, cid, caption, assetId){
  if(cache[picPath]){ showThumb(cid, cache[picPath], caption, picPath, assetId||''); return; }
  gasPost({action:'getImage', token:TOKEN, picturePath:picPath})
    .then(function(r){
      if(r.ok && r.data){
        cache[picPath]=r.data;
        showThumb(cid, r.data, caption, picPath, assetId||'');
      } else {
        var el=document.getElementById('il_'+cid);
        var aid=assetId||'';
        if(el) el.outerHTML='<div class="item-ph" onclick="triggerUpload(\''+cid+'\',\''+aid+'\',\'\')">📷<div style="font-size:11px;margin-top:6px;color:var(--text-s)">Зураг нэмэх</div></div>';
      }
    })
    .catch(function(){
      var el=document.getElementById('il_'+cid);
      var aid=assetId||'';
      if(el) el.outerHTML='<div class="item-ph" onclick="triggerUpload(\''+cid+'\',\''+aid+'\',\'\')">📷<div style="font-size:11px;margin-top:6px;color:var(--text-s)">Зураг нэмэх</div></div>';
    });
}

function showThumb(cid, src, caption, picPath, assetId){
  var el=document.getElementById('il_'+cid);
  if(!el) return;
  var aid=assetId||'';
  var pp=picPath||'';
  var wrap=document.createElement('div');
  wrap.className='item-img-wrap';
  // Зураг
  var img=document.createElement('img');
  img.className='item-img'; img.src=src; img.alt=caption||'';
  img.onclick=function(e){ e.stopPropagation(); openLb(src,caption); };
  // Overlay товчнууд
  var overlay=document.createElement('div');
  overlay.className='img-overlay';
  var btns=document.createElement('div');
  btns.className='img-overlay-btns';
  // Томруулах
  var bZoom=document.createElement('button');
  bZoom.className='img-ov-btn'; bZoom.textContent='🔍 Томруулах';
  bZoom.onclick=function(e){ e.stopPropagation(); openLb(src,caption); };
  // Солих
  var bChange=document.createElement('button');
  bChange.className='img-ov-btn'; bChange.textContent='✏️ Солих';
  bChange.onclick=function(e){ e.stopPropagation(); triggerUpload(cid, aid, pp); };
  btns.appendChild(bZoom);
  btns.appendChild(bChange);
  overlay.appendChild(btns);
  // Saving overlay
  var saving=document.createElement('div');
  saving.className='img-saving'; saving.id='sav_'+cid;
  saving.innerHTML='<div class="img-sp" style="width:28px;height:28px"></div><span>Хадгалж байна…</span>';
  wrap.appendChild(img);
  wrap.appendChild(overlay);
  wrap.appendChild(saving);
  el.parentNode.replaceChild(wrap, el);
}

// Upload trigger
function triggerUpload(cid, assetId, oldPath){
  uploadTarget = { cid:cid, assetId:assetId, oldPath:oldPath };
  document.getElementById('imgFileInput').value='';
  document.getElementById('imgFileInput').click();
}

// Файл сонгосон үед
function onFileSelected(evt){
  var file=evt.target.files[0];
  if(!file) return;
  var cid=uploadTarget.cid;
  var assetId=uploadTarget.assetId;
  var oldPath=uploadTarget.oldPath;
  // Saving overlay харуулах
  var sav=document.getElementById('sav_'+cid);
  if(sav) sav.classList.add('show');
  // FileReader → base64
  var reader=new FileReader();
  reader.onload=function(e){
    var dataUrl=e.target.result;
    var ext=file.name.split('.').pop()||'jpg';
    var fileName=(assetId||Date.now())+'_'+Date.now()+'.'+ext;
    // Drive-д хадгалах
    gasPost({
      action:'saveImage', token:TOKEN,
      assetId:assetId, picPath:oldPath,
      imageData:dataUrl, fileName:fileName
    }).then(function(r){
      if(sav) sav.classList.remove('show');
      if(r.ok){
        // Cache шинэчлэх
        cache[r.newPath]=dataUrl;
        // allGroups дахь picPath шинэчлэх
        allGroups.forEach(function(g){
          g.items.forEach(function(item){
            if(item.assetId===assetId) item.picPath=r.newPath;
          });
        });
        // Зургийг шинэчлэх
        var wrap=document.querySelector('#sav_'+cid) && document.querySelector('#sav_'+cid).parentNode;
        if(wrap){
          var img=wrap.querySelector('.item-img');
          if(img){ img.src=dataUrl; }
        }
      } else {
        alert('Алдаа: '+(r.error||'Хадгалах амжилтгүй'));
      }
    }).catch(function(e){
      if(sav) sav.classList.remove('show');
      alert('Алдаа: '+e.message);
    });
  };
  reader.readAsDataURL(file);
}

function openLb(src,cap){
  document.getElementById('lbimg').src=src;
  document.getElementById('lbcap').textContent=cap||'';
  document.getElementById('lb').classList.add('open');
}
function closeLb(){
  document.getElementById('lb').classList.remove('open');
  document.getElementById('lbimg').src='';
}
document.addEventListener('keydown',function(e){if(e.key==='Escape')closeLb();});

function doPrint(){
  // Print үед бүх өрөөг харуулах
  var tc=document.getElementById('tc');
  var orig=tc.innerHTML;
  var all='';
  allGroups.forEach(function(g){
    all+='<div style="margin-bottom:28px"><div style="font-size:14pt;font-weight:700;border-bottom:2px solid #F5A623;padding-bottom:6px;margin-bottom:12px;color:#C47D0E">'+esc(g.room)+'</div>';
    all+='<div class="item-grid">';
    g.items.forEach(function(item,idx){
      var src=cache[item.picPath]||'';
      all+='<div class="item-card">';
      if(src) all+='<div class="item-img-wrap"><img class="item-img" src="'+src+'" alt=""/></div>';
      else all+='<div class="item-ph">🪑</div>';
      all+='<div class="item-body"><div class="item-name">'+esc(item.furniture)+'</div>';
      all+='<div class="item-qty">Ширхэг: <span class="qty-badge">'+esc(item.qty||'—')+'</span></div>';
      all+='<input class="item-note" type="text" value="'+esc(item.comment||'')+'" placeholder="Тэмдэглэл…"/>';
      all+='</div></div>';
    });
    all+='</div></div>';
  });
  tc.innerHTML=all;
  window.print();
  tc.innerHTML=orig;
  showRoom(activeRoom);
}

// ── EXCEL EXPORT ──
function exportExcel(){
  var villa=document.getElementById('vsel').value||'Villa';
  var now=new Date();
  var ds=now.getFullYear()+'/'+(now.getMonth()+1).toString().padStart(2,'0')+'/'+now.getDate().toString().padStart(2,'0');

  // CSV агуулга үүсгэх (Excel нээнэ, UTF-8 BOM)
  var rows=[['Villa','Өрөө','Тавилга','Ширхэг','Тэмдэглэл','Зураг']];
  allGroups.forEach(function(g){
    g.items.forEach(function(item){
      var note='';
      // Идэвхтэй өрөөний note-уудыг уншиж авах
      document.querySelectorAll('.item-note').forEach(function(inp,i){
        // approximate match by index isn't reliable across rooms — use blank
      });
      rows.push([
        villa,
        item.room||g.room,
        item.furniture||'',
        item.qty||'',
        item.comment||'',
        item.picPath||''
      ]);
    });
  });

  // CSV string
  var csv='\uFEFF'; // UTF-8 BOM
  rows.forEach(function(r){
    csv+=r.map(function(c){
      var s=(c||'').toString().replace(/"/g,'""');
      return '"'+s+'"';
    }).join(',')+'\r\n';
  });

  // Download
  var blob=new Blob([csv],{type:'text/csv;charset=utf-8'});
  var url=URL.createObjectURL(blob);
  var a=document.createElement('a');
  a.href=url;
  a.download=villa+'_'+ds.replace(/\//g,'-')+'.csv';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function gasPost(body){
  return fetch(GAS,{
    method:'POST',
    headers:{'Content-Type':'text/plain;charset=utf-8'},
    body:JSON.stringify(body),
    redirect:'follow'
  }).then(function(r){ if(!r.ok) throw new Error('HTTP '+r.status); return r.json(); });
}
function setSt(msg,type){ var e=document.getElementById('st'); e.textContent=msg; e.className='pill'+(type?' '+type:''); }
function esc(s){ return (s||'').toString().replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function pad(n){ return String(n).padStart(2,'0'); }
['uname','upass'].forEach(function(id){
  var el=document.getElementById(id);
  if(el) el.addEventListener('keydown',function(e){if(e.key==='Enter')doLogin();});
});
