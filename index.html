<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VillaCheck</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',Arial,sans-serif;background:linear-gradient(135deg,#fff8ed,#fef3c7);min-height:100vh;display:flex;align-items:center;justify-content:center}
.card{background:#fff;border-radius:16px;box-shadow:0 8px 32px rgba(0,0,0,.12);padding:40px 36px;width:100%;max-width:380px}
.logo{text-align:center;margin-bottom:24px}
.logo h1{font-size:22px;font-weight:700;color:#C47D0E;margin-top:8px}
.logo p{font-size:13px;color:#6b7280;margin-top:4px}
.field{margin-bottom:14px}
.field label{display:block;font-size:11px;font-weight:600;color:#6b7280;margin-bottom:5px;letter-spacing:.4px;text-transform:uppercase}
.field input{width:100%;padding:10px 14px;border:1.5px solid #e5e7eb;border-radius:8px;font-size:14px;outline:none}
.field input:focus{border-color:#F5A623;box-shadow:0 0 0 3px rgba(245,166,35,.15)}
.field .hint{font-size:11px;color:#aaa;margin-top:4px}
.sep{border-top:1px solid #f0f0f0;margin:8px 0 16px}
.btn{width:100%;padding:11px;background:#F5A623;color:#fff;border:none;border-radius:8px;font-size:15px;font-weight:600;cursor:pointer}
.btn:hover{background:#C47D0E}
.btn:disabled{opacity:.6;cursor:not-allowed}
.err{margin-top:12px;padding:10px 14px;background:#fef2f2;border:1px solid #fca5a5;border-radius:8px;color:#ef4444;font-size:13px;display:none}
.sp{width:14px;height:14px;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:sp .7s linear infinite;display:inline-block;vertical-align:middle;margin-right:6px}
@keyframes sp{to{transform:rotate(360deg)}}

/* APP */
#app{display:none;min-height:100vh;background:#f0f2f5}
#app header{background:#fff;border-bottom:3px solid #F5A623;padding:0 20px;height:56px;display:flex;align-items:center;gap:14px;position:sticky;top:0;z-index:100;box-shadow:0 2px 8px rgba(0,0,0,.06)}
.hlogo{font-size:17px;font-weight:700;color:#C47D0E}
.hsp{flex:1}
.huser{font-size:12px;color:#6b7280}
.hbtn{padding:6px 14px;border-radius:8px;border:1.5px solid #fca5a5;background:#fff;font-size:13px;font-weight:500;cursor:pointer;color:#ef4444}
.hbtn:hover{background:#fef2f2}
.main{max-width:900px;margin:0 auto;padding:20px 16px}
.bcard{background:#fff;border-radius:10px;border:1px solid #e5e7eb;box-shadow:0 1px 6px rgba(0,0,0,.06);padding:18px 22px;margin-bottom:18px}
.vrow{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.vrow label{font-weight:600;font-size:14px}
.vsel{flex:1;min-width:180px;padding:9px 14px;border:2px solid #F5A623;border-radius:10px;font-size:15px;font-weight:600;background:#fff;outline:none}
.pill{display:none;font-size:12px;padding:4px 12px;border-radius:20px;font-weight:500}
.pill.ok{display:inline-block;background:#f0fdf4;color:#15803d}
.pill.err2{display:inline-block;background:#fef2f2;color:#ef4444}
.pill.load{display:inline-block;background:#fff8ed;color:#C47D0E}
.pbtn{padding:6px 14px;border-radius:8px;border:none;background:#1a1a1a;color:#fff;font-size:13px;cursor:pointer}
.pbtn:disabled{opacity:.4;cursor:not-allowed}
table{width:100%;border-collapse:collapse;font-size:13px}
thead tr{background:#F5A623;color:#fff}
th{padding:10px 12px;text-align:left;font-size:12px;font-weight:600}
tbody tr:nth-child(even){background:#f9fafb}
tbody tr:hover{background:#fff8ed}
td{padding:9px 12px;border-bottom:1px solid #e5e7eb;vertical-align:middle}
.ni{width:100%;border:none;border-bottom:1.5px solid #ddd;background:transparent;font-size:13px;padding:2px 4px;outline:none}
.ni:focus{border-bottom-color:#F5A623}
.th{width:60px;height:60px;object-fit:cover;border-radius:6px;cursor:pointer;border:1px solid #e5e7eb}
.emp{text-align:center;padding:50px 20px;color:#6b7280}
.emp .ei{font-size:36px;margin-bottom:10px}

/* Lightbox */
#lb{display:none;position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:999;align-items:center;justify-content:center;flex-direction:column;gap:12px}
#lb.open{display:flex}
#lb img{max-width:90vw;max-height:80vh;border-radius:8px}
#lb .lbc{position:absolute;top:16px;right:20px;color:#fff;font-size:32px;cursor:pointer}
#lb .lbcap{color:#ddd;font-size:13px}

@media print{
  body,#app{background:#fff}
  #loginWrap,#app header,.vrow{display:none!important}
  .bcard{border:none!important;box-shadow:none!important}
  table{font-size:10pt}
  thead tr{background:#F5A623!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
</style>
</head>
<body>

<div id="loginWrap">
  <div class="card">
    <div class="logo">
      <div style="font-size:48px">🏡</div>
      <h1>VillaCheck</h1>
      <p>Хяналтын систем</p>
    </div>
    <div class="field">
      <label>⚙️ Apps Script URL</label>
      <input type="text" id="gasIn" placeholder="https://script.google.com/macros/s/.../exec" style="font-size:11px;font-family:monospace"/>
      <div class="hint">Нэг удаа оруулвал хадгалагдана</div>
    </div>
    <div class="sep"></div>
    <div class="field">
      <label>Хэрэглэгчийн нэр</label>
      <input type="text" id="uname" placeholder="username" autocomplete="username"/>
    </div>
    <div class="field">
      <label>Нүүц үг</label>
      <input type="password" id="upass" placeholder="••••••••" autocomplete="current-password"/>
    </div>
    <button class="btn" id="lbtn" onclick="doLogin()">Нэвтрэх</button>
    <div class="err" id="lerr"></div>
  </div>
</div>

<div id="app">
  <header>
    <div class="hlogo">🏡 VillaCheck</div>
    <div class="hsp"></div>
    <div class="huser">👤 <strong id="husr"></strong></div>
    <button class="hbtn" onclick="doLogout()">Гарах</button>
  </header>
  <div class="main">
    <div class="bcard" id="vc">
      <div class="vrow">
        <label>🏡 Villa:</label>
        <select class="vsel" id="vsel" onchange="loadCP()">
          <option value="">— Villa сонгоно уу —</option>
        </select>
        <span class="pill" id="st"></span>
        <button class="pbtn" id="pbtn" onclick="window.print()" disabled>🖨️ Хэвлэх</button>
      </div>
    </div>
    <div class="bcard" id="tcard" style="display:none">
      <div id="tmeta" style="margin-bottom:14px">
        <div style="font-size:16px;font-weight:700" id="ttitle"></div>
        <div style="font-size:12px;color:#6b7280" id="tsub"></div>
      </div>
      <div id="tc"><div class="emp"><div class="ei">🏠</div><p>Villa сонгоно уу</p></div></div>
    </div>
  </div>
</div>

<div id="lb" onclick="closeLb()">
  <span class="lbc">✕</span>
  <img id="lbimg" src="" alt="">
  <div class="lbcap" id="lbcap"></div>
</div>

<script>
var GAS='', TOKEN='', USER='';
var cache={};

window.onload=function(){
  GAS   = localStorage.getItem('vc_gas') || '';
  TOKEN = localStorage.getItem('vc_tok') || '';
  USER  = localStorage.getItem('vc_usr') || '';
  if(GAS) document.getElementById('gasIn').value=GAS;
  if(TOKEN && USER && GAS){ showApp(); return; }
  document.getElementById('loginWrap').style.display='flex';
};

function doLogin(){
  var g=document.getElementById('gasIn').value.trim();
  var u=document.getElementById('uname').value.trim();
  var p=document.getElementById('upass').value.trim();
  var btn=document.getElementById('lbtn');
  var err=document.getElementById('lerr');
  err.style.display='none';
  if(g && g.indexOf('script.google.com')>-1){ GAS=g; localStorage.setItem('vc_gas',g); }
  if(!u||!p){showErr('Нэр болон нүүц үгийг оруулна уу');return;}
  if(!GAS){showErr('Apps Script URL оруулна уу');return;}
  btn.disabled=true;
  btn.innerHTML='<span class="sp"></span>Нэвтэрч байна…';
  gasPost({action:'login',username:u,password:p}).then(function(r){
    if(r.ok){
      TOKEN=r.token; USER=r.username;
      localStorage.setItem('vc_tok',TOKEN);
      localStorage.setItem('vc_usr',USER);
      showApp();
    } else { showErr(r.error||'Нэвтрэх амжилтгүй'); }
  }).catch(function(e){ showErr('Холбогдсонгүй: '+e.message); })
  .finally(function(){ btn.disabled=false; btn.textContent='Нэвтрэх'; });
}

function showErr(m){ var e=document.getElementById('lerr'); e.textContent=m; e.style.display='block'; }

function showApp(){
  document.getElementById('loginWrap').style.display='none';
  document.getElementById('app').style.display='block';
  document.getElementById('husr').textContent=USER;
  document.getElementById('vc').style.display='';
  document.getElementById('tcard').style.display='';
  loadBuildings();
}

function doLogout(){
  TOKEN=''; USER='';
  localStorage.removeItem('vc_tok');
  localStorage.removeItem('vc_usr');
  location.reload();
}

function loadBuildings(){
  setSt('Уншиж байна…','load');
  gasPost({action:'getBuildings',token:TOKEN}).then(function(r){
    if(!r.ok){setSt(r.error,'err2');return;}
    var s=document.getElementById('vsel');
    s.innerHTML='<option value="">— Villa сонгоно уу —</option>';
    (r.data||[]).forEach(function(n){
      var o=document.createElement('option');
      o.value=o.textContent=n; s.appendChild(o);
    });
    setSt(r.data.length+' villa','ok');
    setTimeout(function(){setSt('','');},2000);
  }).catch(function(e){setSt('Алдаа: '+e.message,'err2');});
}

function loadCP(){
  var v=document.getElementById('vsel').value;
  if(!v) return;
  var tc=document.getElementById('tc');
  tc.innerHTML='<div style="text-align:center;padding:40px;color:#888">Уншиж байна…</div>';
  setSt('Уншиж байна…','load');
  document.getElementById('pbtn').disabled=true;
  gasPost({action:'getCheckpoints',token:TOKEN,villa:v}).then(function(r){
    if(!r.ok){tc.innerHTML='<div class="emp"><div class="ei">⚠️</div><p>'+esc(r.error)+'</p></div>';setSt(r.error,'err2');return;}
    renderTable(r.data||[],v);
    setSt((r.data||[]).length+' зүйл','ok');
    document.getElementById('pbtn').disabled=false;
    var now=new Date();
    var ds=now.getFullYear()+'/'+(now.getMonth()+1).toString().padStart(2,'0')+'/'+now.getDate().toString().padStart(2,'0');
    document.getElementById('ttitle').textContent='🏡 '+v;
    document.getElementById('tsub').textContent=(r.data||[]).length+' шалгах зүйл · '+ds;
  }).catch(function(e){
    tc.innerHTML='<div class="emp"><div class="ei">❌</div><p>'+esc(e.message)+'</p></div>';
    setSt('Алдаа','err2');
  });
}

function renderTable(rows,villa){
  var tc=document.getElementById('tc');
  if(!rows.length){tc.innerHTML='<div class="emp"><div class="ei">🔍</div><p>"'+esc(villa)+'" вилла-д өгөгдөл олдсонгүй</p></div>';return;}
  var h='<table><thead><tr><th style="width:44px;text-align:center">№</th><th style="width:130px">Өрөө</th><th style="width:70px;text-align:center">Ширхэг</th><th>Тэмдэглэл</th><th style="width:80px;text-align:center">Зураг</th></tr></thead><tbody>';
  rows.forEach(function(r,i){
    var pid=r.pictureId||'';
    var imgCell=pid?'<span id="ig'+i+'">⏳</span>':'<span style="color:#ccc">—</span>';
    h+='<tr><td style="text-align:center;color:#6b7280;font-weight:600">'+esc(r.num)+'</td><td style="font-weight:500">'+esc(r.room)+'</td><td style="text-align:center">'+esc(r.shirkheg)+'</td><td><input class="ni" type="text" placeholder="Тэмдэглэл…"/></td><td style="text-align:center" id="ic'+i+'">'+imgCell+'</td></tr>';
  });
  h+='</tbody></table>';
  tc.innerHTML=h;
  rows.forEach(function(r,i){ if(r.pictureId) loadImg(r.pictureId,i,r.room); });
}

function loadImg(pid,idx,cap){
  if(cache[pid]){showThumb(idx,cache[pid],cap);return;}
  gasPost({action:'getImage',token:TOKEN,pictureId:pid}).then(function(r){
    if(r.ok&&r.data){cache[pid]=r.data;showThumb(idx,r.data,cap);}
    else{var c=document.getElementById('ic'+idx);if(c)c.innerHTML='<span style="color:#ccc">❌</span>';}
  }).catch(function(){var c=document.getElementById('ic'+idx);if(c)c.innerHTML='<span style="color:#ccc">❌</span>';});
}

function showThumb(idx,src,cap){
  var c=document.getElementById('ic'+idx); if(!c)return;
  var img=document.createElement('img');
  img.className='th'; img.src=src; img.alt=cap||'';
  img.onclick=function(){openLb(src,cap);};
  c.innerHTML=''; c.appendChild(img);
}

function openLb(src,cap){
  document.getElementById('lbimg').src=src;
  document.getElementById('lbcap').textContent=cap||'';
  document.getElementById('lb').classList.add('open');
}
function closeLb(){ document.getElementById('lb').classList.remove('open'); document.getElementById('lbimg').src=''; }
document.addEventListener('keydown',function(e){if(e.key==='Escape')closeLb();});

function gasPost(body){
  return fetch(GAS,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(body),redirect:'follow'})
    .then(function(r){if(!r.ok)throw new Error('HTTP '+r.status);return r.json();});
}

function setSt(msg,type){ var e=document.getElementById('st'); e.textContent=msg; e.className='pill'+(type?' '+type:''); }
function esc(s){ return (s||'').toString().replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

// Enter key
document.addEventListener('DOMContentLoaded',function(){
  ['gasIn','uname','upass'].forEach(function(id){
    var el=document.getElementById(id);
    if(el) el.addEventListener('keydown',function(e){if(e.key==='Enter')doLogin();});
  });
});
</script>
</body>
</html>
