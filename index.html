<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VillaCheck</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',Arial,sans-serif;background:linear-gradient(135deg,#fff8ed,#fef3c7);min-height:100vh;display:flex;align-items:center;justify-content:center}
.card{background:#fff;border-radius:16px;box-shadow:0 8px 32px rgba(0,0,0,.12);padding:40px 36px;width:100%;max-width:380px}
.logo{text-align:center;margin-bottom:24px}
.logo h1{font-size:22px;font-weight:700;color:#C47D0E;margin-top:8px}
.logo p{font-size:13px;color:#6b7280;margin-top:4px}
.field{margin-bottom:14px}
.field label{display:block;font-size:11px;font-weight:600;color:#6b7280;margin-bottom:5px;letter-spacing:.4px;text-transform:uppercase}
.field input{width:100%;padding:10px 14px;border:1.5px solid #e5e7eb;border-radius:8px;font-size:14px;outline:none}
.field input:focus{border-color:#F5A623;box-shadow:0 0 0 3px rgba(245,166,35,.15)}
.hint{font-size:11px;color:#aaa;margin-top:4px}
.sep{border-top:1px solid #f0f0f0;margin:8px 0 16px}
.btn{width:100%;padding:11px;background:#F5A623;color:#fff;border:none;border-radius:8px;font-size:15px;font-weight:600;cursor:pointer}
.btn:hover{background:#C47D0E}
.btn:disabled{opacity:.6;cursor:not-allowed}
.err{margin-top:12px;padding:10px 14px;background:#fef2f2;border:1px solid #fca5a5;border-radius:8px;color:#ef4444;font-size:13px;display:none}
.sp{width:14px;height:14px;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:sp .7s linear infinite;display:inline-block;vertical-align:middle;margin-right:6px}
@keyframes sp{to{transform:rotate(360deg)}}

/* APP */
#app{display:none;min-height:100vh;background:#f5f0e8}
header{background:#fff;border-bottom:3px solid #F5A623;padding:0 20px;height:56px;display:flex;align-items:center;gap:14px;position:sticky;top:0;z-index:100;box-shadow:0 2px 8px rgba(0,0,0,.06)}
.hlogo{font-size:17px;font-weight:700;color:#C47D0E}
.hsp{flex:1}
.huser{font-size:12px;color:#6b7280}
.hbtn{padding:6px 14px;border-radius:8px;border:1.5px solid #fca5a5;background:#fff;font-size:13px;font-weight:500;cursor:pointer;color:#ef4444}
.hbtn:hover{background:#fef2f2}
.main{max-width:960px;margin:0 auto;padding:20px 16px}
.bcard{background:#fff;border-radius:12px;border:1px solid #e5e7eb;box-shadow:0 1px 6px rgba(0,0,0,.06);padding:18px 22px;margin-bottom:18px}

/* Villa selector */
.vrow{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.vrow label{font-weight:600;font-size:14px}
.vsel{flex:1;min-width:180px;padding:9px 14px;border:2px solid #F5A623;border-radius:10px;font-size:15px;font-weight:600;background:#fff;outline:none;cursor:pointer}
.pill{display:none;font-size:12px;padding:4px 12px;border-radius:20px;font-weight:500}
.pill.ok{display:inline-block;background:#f0fdf4;color:#15803d}
.pill.er{display:inline-block;background:#fef2f2;color:#ef4444}
.pill.ld{display:inline-block;background:#fff8ed;color:#C47D0E}
.pbtn{padding:7px 16px;border-radius:8px;border:none;background:#1a1a1a;color:#fff;font-size:13px;font-weight:500;cursor:pointer;display:flex;align-items:center;gap:6px}
.pbtn:disabled{opacity:.4;cursor:not-allowed}

/* Room бүлэг */
.room-section{margin-bottom:24px}
.room-title{font-size:14px;font-weight:700;color:#C47D0E;padding:8px 0 10px;border-bottom:2px solid #F5A623;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.room-title .rc{background:#F5A623;color:#fff;font-size:11px;padding:2px 8px;border-radius:20px;font-weight:600}

/* Grid карт */
.item-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.item-card{border:1px solid #e5e7eb;border-radius:10px;overflow:hidden;background:#fff;transition:box-shadow .15s}
.item-card:hover{box-shadow:0 4px 16px rgba(0,0,0,.1)}
.item-img{width:100%;height:140px;object-fit:cover;display:block;cursor:pointer;background:#f9fafb}
.item-img-ph{width:100%;height:140px;background:#f3f4f6;display:flex;align-items:center;justify-content:center;font-size:32px;color:#d1d5db}
.item-body{padding:10px 12px}
.item-name{font-size:13px;font-weight:600;color:#1a1a1a;margin-bottom:4px;line-height:1.3}
.item-qty{font-size:12px;color:#6b7280;margin-bottom:8px}
.item-note{width:100%;border:none;border-bottom:1.5px solid #e5e7eb;background:transparent;font-size:12px;padding:3px 2px;outline:none;color:#374151}
.item-note:focus{border-bottom-color:#F5A623}
.img-spin{width:100%;height:140px;display:flex;align-items:center;justify-content:center;background:#f9fafb;font-size:24px;animation:sp2 1s linear infinite}
@keyframes sp2{to{transform:rotate(360deg)}}

.emp{text-align:center;padding:50px 20px;color:#6b7280}
.emp .ei{font-size:40px;margin-bottom:12px}
.emp p{font-size:14px}

/* Lightbox */
#lb{display:none;position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:999;align-items:center;justify-content:center;flex-direction:column;gap:12px}
#lb.open{display:flex}
#lb img{max-width:90vw;max-height:82vh;border-radius:8px;box-shadow:0 8px 40px rgba(0,0,0,.5)}
#lb .lbc{position:absolute;top:16px;right:20px;color:#fff;font-size:34px;cursor:pointer;line-height:1}
#lb .lbcap{color:#ccc;font-size:13px;margin-top:4px}

@media print{
  body,#app{background:#fff!important}
  #loginWrap,header,.vrow{display:none!important}
  .bcard{border:none!important;box-shadow:none!important;padding:8px 0!important}
  .item-grid{grid-template-columns:repeat(3,1fr);gap:8px}
  .item-img,.item-img-ph{height:100px}
  .item-body{padding:6px 8px}
}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="loginWrap">
  <div class="card">
    <div class="logo">
      <div style="font-size:48px">🏡</div>
      <h1>VillaCheck</h1>
      <p>Хяналтын систем</p>
    </div>
    <div class="field">
      <label>⚙️ Apps Script URL</label>
      <input type="text" id="gasIn" placeholder="https://script.google.com/macros/s/.../exec" style="font-size:11px;font-family:monospace"/>
      <div class="hint">Нэг удаа оруулвал хадгалагдана</div>
    </div>
    <div class="sep"></div>
    <div class="field">
      <label>Хэрэглэгчийн нэр</label>
      <input type="text" id="uname" placeholder="username" autocomplete="username"/>
    </div>
    <div class="field">
      <label>Нүүц үг</label>
      <input type="password" id="upass" placeholder="••••••••" autocomplete="current-password"/>
    </div>
    <button class="btn" id="lbtn" onclick="doLogin()">Нэвтрэх</button>
    <div class="err" id="lerr"></div>
  </div>
</div>

<!-- APP -->
<div id="app">
  <header>
    <div class="hlogo">🏡 VillaCheck</div>
    <div class="hsp"></div>
    <div class="huser">👤 <strong id="husr"></strong></div>
    <button class="hbtn" onclick="doLogout()">Гарах</button>
  </header>
  <div class="main">

    <!-- Villa сонгох -->
    <div class="bcard">
      <div class="vrow">
        <label>🏡 Villa:</label>
        <select class="vsel" id="vsel" onchange="loadCP()">
          <option value="">— Villa сонгоно уу —</option>
        </select>
        <span class="pill" id="st"></span>
        <button class="pbtn" id="pbtn" onclick="window.print()" disabled>🖨️ Хэвлэх</button>
      </div>
    </div>

    <!-- Хяналтын хуудас -->
    <div class="bcard" id="tcard" style="display:none">
      <div id="tmeta" style="margin-bottom:16px">
        <div style="font-size:18px;font-weight:700" id="ttitle"></div>
        <div style="font-size:12px;color:#6b7280;margin-top:2px" id="tsub"></div>
      </div>
      <div id="tc">
        <div class="emp"><div class="ei">🏠</div><p>Villa сонгоно уу</p></div>
      </div>
    </div>

  </div>
</div>

<!-- Lightbox -->
<div id="lb" onclick="closeLb()">
  <span class="lbc">✕</span>
  <img id="lbimg" src="" alt="">
  <div class="lbcap" id="lbcap"></div>
</div>

<script>
var GAS='', TOKEN='', USER='';
var cache={};

window.onload = function() {
  GAS   = localStorage.getItem('vc_gas') || '';
  TOKEN = localStorage.getItem('vc_tok') || '';
  USER  = localStorage.getItem('vc_usr') || '';
  if (GAS) document.getElementById('gasIn').value = GAS;
  if (TOKEN && USER && GAS) { showApp(); return; }
  document.getElementById('loginWrap').style.display = 'flex';
};

function doLogin() {
  var g   = document.getElementById('gasIn').value.trim();
  var u   = document.getElementById('uname').value.trim();
  var p   = document.getElementById('upass').value.trim();
  var btn = document.getElementById('lbtn');
  document.getElementById('lerr').style.display = 'none';
  if (g && g.indexOf('script.google.com') > -1) { GAS = g; localStorage.setItem('vc_gas', g); }
  if (!u || !p) { showErr('Нэр болон нүүц үгийг оруулна уу'); return; }
  if (!GAS)     { showErr('Apps Script URL оруулна уу'); return; }
  btn.disabled = true;
  btn.innerHTML = '<span class="sp"></span>Нэвтэрч байна…';
  gasPost({action:'login', username:u, password:p})
    .then(function(r) {
      if (r.ok) {
        TOKEN = r.token; USER = r.username;
        localStorage.setItem('vc_tok', TOKEN);
        localStorage.setItem('vc_usr', USER);
        showApp();
      } else { showErr(r.error || 'Нэвтрэх амжилтгүй'); }
    })
    .catch(function(e) { showErr('Холбогдсонгүй: ' + e.message); })
    .finally(function() { btn.disabled = false; btn.textContent = 'Нэвтрэх'; });
}

function showErr(m) {
  var e = document.getElementById('lerr');
  e.textContent = m; e.style.display = 'block';
}

function showApp() {
  document.getElementById('loginWrap').style.display = 'none';
  document.getElementById('app').style.display = 'block';
  document.getElementById('husr').textContent = USER;
  document.getElementById('tcard').style.display = '';
  loadBuildings();
}

function doLogout() {
  TOKEN = ''; USER = '';
  localStorage.removeItem('vc_tok');
  localStorage.removeItem('vc_usr');
  location.reload();
}

function loadBuildings() {
  setSt('Уншиж байна…', 'ld');
  gasPost({action:'getBuildings', token:TOKEN})
    .then(function(r) {
      if (!r.ok) { setSt(r.error, 'er'); return; }
      var s = document.getElementById('vsel');
      s.innerHTML = '<option value="">— Villa сонгоно уу —</option>';
      (r.data || []).forEach(function(n) {
        var o = document.createElement('option');
        o.value = o.textContent = n;
        s.appendChild(o);
      });
      setSt(r.data.length + ' villa', 'ok');
      setTimeout(function() { setSt('', ''); }, 2000);
    })
    .catch(function(e) { setSt('Алдаа: ' + e.message, 'er'); });
}

function loadCP() {
  var v = document.getElementById('vsel').value;
  if (!v) return;
  var tc = document.getElementById('tc');
  tc.innerHTML = '<div style="text-align:center;padding:40px;color:#888;font-size:14px">⏳ Уншиж байна…</div>';
  setSt('Уншиж байна…', 'ld');
  document.getElementById('pbtn').disabled = true;

  gasPost({action:'getCheckpoints', token:TOKEN, villa:v})
    .then(function(r) {
      if (!r.ok) {
        tc.innerHTML = '<div class="emp"><div class="ei">⚠️</div><p>' + esc(r.error) + '</p></div>';
        setSt(r.error, 'er'); return;
      }
      var data = r.data || [];
      var total = data.reduce(function(s, g) { return s + g.items.length; }, 0);
      renderRooms(data, v);
      setSt(total + ' тавилга', 'ok');
      document.getElementById('pbtn').disabled = false;
      var now = new Date();
      var ds = now.getFullYear() + '/' + pad(now.getMonth()+1) + '/' + pad(now.getDate());
      document.getElementById('ttitle').textContent = '🏡 ' + v;
      document.getElementById('tsub').textContent = total + ' тавилга · ' + ds;
    })
    .catch(function(e) {
      tc.innerHTML = '<div class="emp"><div class="ei">❌</div><p>' + esc(e.message) + '</p></div>';
      setSt('Алдаа', 'er');
    });
}

function renderRooms(groups, villa) {
  var tc = document.getElementById('tc');
  if (!groups.length) {
    tc.innerHTML = '<div class="emp"><div class="ei">🔍</div><p>"' + esc(villa) + '" вилла-д өгөгдөл олдсонгүй</p></div>';
    return;
  }
  var html = '';
  groups.forEach(function(g) {
    html += '<div class="room-section">';
    html += '<div class="room-title">🚪 ' + esc(g.room) + ' <span class="rc">' + g.items.length + '</span></div>';
    html += '<div class="item-grid">';
    g.items.forEach(function(item, idx) {
      var cardId = 'card_' + g.room.replace(/\s/g,'_') + '_' + idx;
      html += '<div class="item-card" id="' + cardId + '">';
      // Зураг placeholder
      if (item.picPath) {
        html += '<div class="img-spin" id="sp_' + cardId + '">⏳</div>';
      } else {
        html += '<div class="item-img-ph">🪑</div>';
      }
      html += '<div class="item-body">';
      html += '<div class="item-name">' + esc(item.furniture) + '</div>';
      html += '<div class="item-qty">Ширхэг: <strong>' + esc(item.qty || '—') + '</strong></div>';
      html += '<input class="item-note" type="text" placeholder="Тэмдэглэл…" value="' + esc(item.comment) + '"/>';
      html += '</div></div>';
    });
    html += '</div></div>';
  });
  tc.innerHTML = html;

  // Зургуудыг асинхронаар ачаалах
  groups.forEach(function(g) {
    g.items.forEach(function(item, idx) {
      if (!item.picPath) return;
      var cardId = 'card_' + g.room.replace(/\s/g,'_') + '_' + idx;
      loadImg(item.picPath, cardId, item.furniture);
    });
  });
}

function loadImg(picPath, cardId, caption) {
  if (cache[picPath]) { showThumb(cardId, cache[picPath], caption); return; }
  gasPost({action:'getImage', token:TOKEN, picturePath:picPath})
    .then(function(r) {
      if (r.ok && r.data) {
        cache[picPath] = r.data;
        showThumb(cardId, r.data, caption);
      } else {
        var sp = document.getElementById('sp_' + cardId);
        if (sp) sp.outerHTML = '<div class="item-img-ph">🖼️</div>';
      }
    })
    .catch(function() {
      var sp = document.getElementById('sp_' + cardId);
      if (sp) sp.outerHTML = '<div class="item-img-ph">🖼️</div>';
    });
}

function showThumb(cardId, src, caption) {
  var sp = document.getElementById('sp_' + cardId);
  if (!sp) return;
  var img = document.createElement('img');
  img.className = 'item-img';
  img.src = src;
  img.alt = caption || '';
  img.onclick = function() { openLb(src, caption); };
  sp.parentNode.replaceChild(img, sp);
}

function openLb(src, cap) {
  document.getElementById('lbimg').src = src;
  document.getElementById('lbcap').textContent = cap || '';
  document.getElementById('lb').classList.add('open');
}
function closeLb() {
  document.getElementById('lb').classList.remove('open');
  document.getElementById('lbimg').src = '';
}
document.addEventListener('keydown', function(e) { if (e.key === 'Escape') closeLb(); });

function gasPost(body) {
  return fetch(GAS, {
    method: 'POST',
    headers: {'Content-Type': 'text/plain;charset=utf-8'},
    body: JSON.stringify(body),
    redirect: 'follow'
  }).then(function(r) {
    if (!r.ok) throw new Error('HTTP ' + r.status);
    return r.json();
  });
}

function setSt(msg, type) {
  var e = document.getElementById('st');
  e.textContent = msg;
  e.className = 'pill' + (type ? ' ' + type : '');
}
function esc(s) {
  return (s||'').toString().replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function pad(n) { return String(n).padStart(2,'0'); }

// Enter key
['gasIn','uname','upass'].forEach(function(id) {
  var el = document.getElementById(id);
  if (el) el.addEventListener('keydown', function(e) { if (e.key==='Enter') doLogin(); });
});
</script>
</body>
</html>
